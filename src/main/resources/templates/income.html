<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--reference to CSS library - Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link th:href="@{/css/income.css}" rel="stylesheet" />
    <!-- Flatpicker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <title>Income page</title>
</head>
<body>
<h1>Income page</h1>
<div class="container mt-5">
    <form th:action="@{/registerIncome}" th:object="${income_mod_attribute}" method="post" class="needs-validation">
        <div class="form-group">
            <label for="incType">IncomeType:</label>
            <select id="incType" name="incType" th:field="*{incomeType}" required>>
                <option value="">-- Select income type --</option>
                <option th:each="incType : ${incomes}"
                        th:value="${incType}"
                        th:text="${incType}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="text" class="form-control" id="amount" th:field="*{amount}" required>
        </div>
        <div class="form-group">
            <label for="currency">Currency:</label>
            <select id="currency" name="curName" th:field="*{currency}" required>>
                <option value="">-- Select currency name --</option>
                <option th:each="currency : ${currencyNames}"
                        th:value="${currency}"
                        th:text="${currency}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="transDate">Transaction Date:</label>
            <input type="text" class="form-control" id="transDate"  th:field="*{transactionDate}" required>
        </div>
        <div class="form-group">
            <label for="transType">Transaction Type:</label>
            <select id="transType" name="transType" th:field="*{transactionType}" required>>
                <option value="">-- Select transaction type: --</option>
                <option th:each="transType : ${transactionTypes}"
                        th:value="${transType}"
                        th:text="${transType}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="cardNum">Card:</label>
            <input type="text" class="form-control" id="cardNum" th:field="*{cardNum}" maxlength="4" required>
        </div>
        <div class="form-group">
            <label for="operDesc">Description:</label>
            <input type="text" class="form-control" id="operDesc" th:field="*{operDescription}" maxlength="50" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <h2>Last 10 Income operations</h2>
    <h6>Currency: 1-EUR,2-UAH,3-DKK,4-USD</h6>
    <!-- Card and cash operations -->
        <table class="full-width-table">
        <thead>
        <tr>
            <th>Income Type</th>
            <th>Amount</th>
            <th>Currency</th>
            <th>Date</th>
            <th>Target Card</th>
            <th>Comments</th>
        </tr>
        </thead>
        <tbody>
        <!-- Card operations -->
        <tr th:each="incomeCard : ${incomesLastTenCard}">
            <td>
            <span th:switch="${incomeCard.iType}">
                <span th:case="14">Salary</span>
                <span th:case="39">Bonus</span>
                <span th:case="41">Travel Refund</span>
                <span th:case="42">Shop Refund</span>
                <span th:case="74">Money Transfer R</span>
                <span th:case="43">Other</span>
            </span>
            </td>
            <td th:text="${incomeCard.amount}"></td>
            <td th:text="${incomeCard.currency}"></td>
            <td th:text="${#temporals.format(incomeCard.date, 'dd-MM-yyy')}"></td>
            <td th:text="${incomeCard.targetCard}"></td>
            <td th:text="${incomeCard.comments}"></td>
        </tr>
        <!-- Cash operations -->
        <tr th:each="incomeCash : ${incomesLastTenCash}">
            <td>
            <span th:switch="${incomeCash.iType}">
                <span th:case="14">Salary</span>
                <span th:case="39">Bonus</span>
                <span th:case="41">Travel Refund</span>
                <span th:case="42">Shop Refund</span>
                <span th:case="74">Money Transfer R</span>
                <span th:case="43">Other</span>
            </span>
            </td>
            <td th:text="${incomeCash.amount}"></td>
            <td th:text="${incomeCash.currency}"></td>
            <td th:text="${#temporals.format(incomeCash.date, 'dd-MM-yyy')}"></td>
            <td th:text="'----'"></td>
            <td th:text="${incomeCash.operType}"></td>
            <td th:text="${incomeCash.comments}"></td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
    setTimeout(() => {
        flatpickr("#transDate", {
            dateFormat: "d.m.Y H:i",
            enableTime: true,
            noCalendar: false,
            time_24hr: true,
            maxDate: new Date()
        });
    }, 100);
</script>
</body>
</html>
