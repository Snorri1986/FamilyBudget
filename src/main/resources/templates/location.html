<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Redirect to main.page -->
    <meta http-equiv="refresh" content="30;url=/main">
    <!--reference to CSS library - Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link th:href="@{/css/location.css}" rel="stylesheet" />
    <title>Set new card</title>
</head>
<body>
<h1>Set new location!</h1>
<div class="container mt-5">
    <form th:action="@{/registerNewLocation}" th:object="${location_attribute}" method="post" class="needs-validation">
        <div class="form-group">
            <label for="newCity">New city:</label>
            <input type="text" class="form-control" id="newCity" th:field="*{city}" maxlength="50" required>
        </div>
        <div class="form-group">
            <label for="newCountry">New country:</label>
            <input type="text" class="form-control" id="newCountry" th:field="*{country}" maxlength="50" required>
        </div>
        <div class="form-group">
            <label for="newVat">New VAT:</label>
            <input type="text" class="form-control" id="newVat" th:field="*{vat}" maxlength="2" required>
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
<p>Return back to main page <a th:href="@{/login}">here</a>.</p>
</div>>
</body>
</html>
