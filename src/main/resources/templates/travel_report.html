<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Redirect to main.page -->
    <meta http-equiv="refresh" content="30;url=/main">
    <!--reference to CSS library - Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link th:href="@{/css/travel_report.css}" rel="stylesheet" />
    <title>Travel report</title>
</head>
<body>
<h1>Request travel report</h1>
<div class="container mt-5">
    <form th:action="@{/getTravelReport}" th:object="${travel_request_mod}" method="post" class="needs-validation">
        <div class="form-group">
            <label for="Destination">Destination:</label>
            <input type="text" class="form-control" id="Destination" th:field="*{travelDestination}" maxlength="255" required>
        </div>
        <button type="submit" class="btn btn-primary">Get</button>
        <!-- Web report -->
        <h6>Currency: 1-EUR,2-UAH,3-DKK,4-USD</h6>
        <table class="full-width-table">
            <thead>
            <tr>
                <th>Transaction Type</th>
                <th>Amount</th>
                <th>Currency</th>
                <th>Date</th>
                <th>Card/Cash</th>
                <th>Comments</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="travel_expenses : ${reportList}">
                <td>
            <span th:switch="${travel_expenses.travelExpenseTypeID}">
                <span th:case="33">Tickets</span>
                <span th:case="34">Hotel</span>
                <span th:case="35">FoodInTrip</span>
                <span th:case="36">TravelEntertainment</span>
                <span th:case="7">PublicTransport</span>
                <span th:case="12">Others</span>
            </span>
                </td>
                <td th:text="${travel_expenses.amount}"></td>
                <td th:text="${travel_expenses.currency}"></td>
                <td th:text="${#temporals.format(travel_expenses.transactionDate, 'dd-MM-yyy')}"></td>
                <td th:text="${travel_expenses.sourceCard}"></td>
                <td th:text="${travel_expenses.comments}"></td>
            </tr>
            </tbody>
        </table>
    </form>
    <div class="currency">
    <p>USD: <td th:text="${SumUSD}"></td></p>
    <p>EUR: <td th:text="${SumEUR}"></td></p>
    <p>DKK: <td th:text="${SumDKK}"></td></p>
    <p>UAH: <td th:text="${SumUAH}"></td></p>
    </div>
    <p>Return back to main page <a th:href="@{/login}">here</a>.</p>
</div>
</body>
</html>
