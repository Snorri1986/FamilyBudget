<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Redirect to main.page -->
    <meta http-equiv="refresh" content="30;url=/main">
    <!--reference to CSS library - Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link th:href="@{/css/travel_report.css}" rel="stylesheet" />
    <title>Travel report</title>
</head>
<body>
<h1>Request travel report</h1>
<div class="container mt-5">
    <form th:action="@{/getTravelReport}" th:object="${travel_request_mod}" method="post" class="needs-validation">
        <div class="form-group">
            <label for="Destination">Destination:</label>
            <input type="text" class="form-control" id="Destination" th:field="*{travelDestination}" maxlength="255" required>
        </div>
        <button type="submit" class="btn btn-primary">Get</button>
    </form>
    <p>Return back to main page <a th:href="@{/login}">here</a>.</p>
</div>>
</body>
</html>
