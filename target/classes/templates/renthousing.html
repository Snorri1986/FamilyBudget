<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--reference to CSS library - Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link th:href="@{/css/renthousing.css}" rel="stylesheet" />
    <!-- Flatpicker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <title>Renthousing page</title>
</head>
<body>
<h1>Renthousing page</h1>
<div class="container mt-5">
    <form th:action="@{/registerHousing}" th:object="${rent_housing_mod_attribute}" method="post" class="needs-validation">
        <div class="form-group">
            <label for="housingType">Housing Purchase Type:</label>
            <select id="housingType" name="housingType" th:field="*{housingType}" required>>
                <option value="">-- Select purchase type --</option>
                <option th:each="housingType : ${housingTypes}"
                        th:value="${housingType}"
                        th:text="${housingType}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="text" class="form-control" id="amount" th:field="*{amount}" required>
        </div>
        <div class="form-group">
            <label for="currency">Currency:</label>
            <select id="currency" name="curName" th:field="*{currency}" required>>
                <option value="">-- Select currency name --</option>
                <option th:each="currency : ${currencyNames}"
                        th:value="${currency}"
                        th:text="${currency}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="transDate">Transaction Date:</label>
            <input type="text" class="form-control" id="transDate"  th:field="*{transactionDate}" required>
        </div>
        <div class="form-group">
            <label for="transType">Transaction Type:</label>
            <select id="transType" name="transType" th:field="*{transactionType}" required>>
                <option value="">-- Select transaction type: --</option>
                <option th:each="transType : ${transactionTypes}"
                        th:value="${transType}"
                        th:text="${transType}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="cardNum">Card:</label>
            <input type="text" class="form-control" id="cardNum" th:field="*{cardNum}" maxlength="4" required>
        </div>
        <div class="form-group">
            <label for="operDesc">Description:</label>
            <input type="text" class="form-control" id="operDesc" th:field="*{operDescription}" maxlength="50" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <h2>Last 10 RentHousing operations</h2>
    <h6>Currency: 1-EUR,2-UAH,3-DKK,4-USD</h6>
    <table class="full-width-table">
        <thead>
        <tr>
            <th>RentHousing Type</th>
            <th>Amount</th>
            <th>Currency</th>
            <th>Date</th>
            <th>Card</th>
            <th>Operation type</th>
            <th>Comments</th>
        </tr>
        </thead>
        <tbody>
        <!-- Card operations -->
        <tr th:each="rentCard : ${rentHousingLastTenCard}">
            <td>
                <span th:switch="${rentCard.housingRentType}">
                   <span th:case="2">Rent</span>
                <span th:case="40">MT Send</span>
                <span th:case="39">A-kasse</span>
                <span th:case="29">Electricity</span>
                <span th:case="30">Houseequipment</span>
                <span th:case="31">Renovation</span>
                <span th:case="22">Other</span>
                </span>
            </td>
            <td th:text="${rentCard.amount}"></td>
            <td th:text="${rentCard.currency}"></td>
            <td th:text="${#temporals.format(rentCard.date, 'dd-MM-yyy')}"></td>
            <td th:text="${rentCard.sourceCard}"></td>
            <td th:text="${rentCard.operType}"></td>
            <td th:text="${rentCard.comments}"></td>
        </tr>
        <!-- Cash operations -->
        <tr th:each="rentCash : ${rentHousingLastTenCash}">
            <td>
                <span th:switch="${rentCash.housingRentType}">
                   <span th:case="2">Rent</span>
                <span th:case="40">MT Send</span>
                <span th:case="39">A-kasse</span>
                <span th:case="29">Electricity</span>
                <span th:case="30">Houseequipment</span>
                <span th:case="31">Renovation</span>
                <span th:case="22">Other</span>
                </span>
            </td>
            <td th:text="${rentCash.amount}"></td>
            <td th:text="${rentCash.currency}"></td>
            <td th:text="${#temporals.format(rentCash.date, 'dd-MM-yyy')}"></td>
            <td th:text="'----'"></td>
            <td th:text="${rentCash.operType}"></td>
            <td th:text="${rentCash.comments}"></td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
    setTimeout(() => {
          flatpickr("#transDate", {
              dateFormat: "d.m.Y H:i",
              enableTime: true,
              noCalendar: false,
              time_24hr: true,
              maxDate: new Date()
          });
      }, 100);
</script>
</body>
</html>
